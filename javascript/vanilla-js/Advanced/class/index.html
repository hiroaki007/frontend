<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javascript 特訓 class</title>

    <style>

        .box {
            display: none;
        }

        .box.active {
            display: block;
        }


    </style>


</head>
<body>

    <button id="btn">開閉</button>  
    <div class="box active">中身</div>


    <script>

        const btn = document.querySelector('#btn');
        const box = document.querySelector('.box');

        btn.addEventListener('click', () => {
            box.classList.toggle("active")

            // if(box.classList.contains('active')) {
            //     btn.textContent = '閉じる'
            // } else {
            //     btn.textContent = '開く'
            // }
            

        });


    </script>

</body>
</html>
